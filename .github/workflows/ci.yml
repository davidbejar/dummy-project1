# On every push and pull request: unit tests and integration tests, then the DAST scans
# (ZAP + Nuclei) once they pass.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runner image pinned to a specific Ubuntu release (not ubuntu-latest), so OS upgrades happen
# when we choose them. Change all four `runs-on` lines together.
jobs:
  frontend:
    name: Frontend unit tests
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x
      - run: deno install --frozen
      - run: deno task check
      # Same as `deno task test`, but with -A: on Linux, Vite's WSL check reads
      # /proc/sys/fs/binfmt_misc/WSLInterop, which Deno only allows with --allow-all.
      # --pool=forks: on Linux, Deno lacks parentPort.removeAllListeners, which the
      # threads pool calls at teardown. Forks need --allow-run, which -A already grants.
      - run: deno run -A npm:vitest run --pool=forks

  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -B test

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Start CockroachDB
        run: docker compose up -d --wait cockroachdb
      # `verify` runs the unit tests again before the *IT.java tests; they're quick.
      - name: Run integration tests
        working-directory: backend
        run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/

  dast:
    name: DAST (ZAP + Nuclei)
    needs: [frontend, backend-unit, backend-integration]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Run the scans
        run: dast/run.sh
      - name: Upload DAST reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dast-reports
          path: dast/reports/
