spring:
  application:
    name: backend
  datasource:
    # CockroachDB speaks the PostgreSQL wire protocol, so the standard Postgres driver is used.
    url: ${DB_URL:jdbc:postgresql://localhost:26257/app?sslmode=disable}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Hibernate detects CockroachDB and picks CockroachDialect automatically.
      ddl-auto: validate
  flyway:
    enabled: true
    # CockroachDB 26+ blocks crdb_internal by default, but Flyway reads it to detect the
    # server version. Allow it on Flyway's own connection only, not the app's pool.
    init-sqls: SET allow_unsafe_internals = true
    # db/dev-data holds development seed data (e.g. the admin and david users).
    # In production, set FLYWAY_LOCATIONS=classpath:db/migration to leave it out.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/dev-data}

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        # Set SESSION_COOKIE_SECURE=true when served over HTTPS.
        secure: ${SESSION_COOKIE_SECURE:false}

springdoc:
  api-docs:
    # The OpenAPI description at /v3/api-docs is public, so the DAST scan can import it.
    # In production, set API_DOCS_ENABLED=false to stop publishing it.
    enabled: ${API_DOCS_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
